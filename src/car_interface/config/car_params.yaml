# car_params.yaml — car_interface 节点默认参数配置
#
# 使用方式:
#   ros2 run car_interface car_interface_node --ros-args -p port:=/dev/ttyUSB0
#   或通过 launch 文件加载此 YAML

car_interface_node:
  ros__parameters:
    # ---- 串口配置 ----
    port: "/dev/ttyUSB0"          # 串口设备路径
    baudrate: 115200              # 波特率 (USB 虚拟串口可任意值)

    # ---- 坐标系配置 ----
    odom_frame: "odom"            # 里程计坐标系 ID
    base_frame: "base_footprint"  # 机器人本体坐标系 ID

    # ---- 运行参数 ----
    status_rate: 20.0             # 状态查询 / 里程计发布频率 (Hz)
    cmd_vel_timeout: 0.5          # cmd_vel 超时自动停车时间 (秒)

    # ---- 安全限幅 ----
    max_linear_mms: 500.0         # 最大线速度 (mm/s)，防止指令超出小车能力
    max_angular_degs: 180.0       # 最大角速度 (deg/s)，防止指令超出小车能力
